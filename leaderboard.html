<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
    <link rel="shortcut icon" href="favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星海猎手 V7 - 全球联机排行榜</title>
    <meta name="description" content="星海猎手 V7 官方全球联机排行榜。同步本地最高分，查阅全服星海勇士排名。">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Outfit:wght@300;400;600;800&family=Noto+Sans+SC:wght@300;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="leaderboard.css?v=7.5">
</head>
<body>
    <a class="skip-link" href="#mainContent">跳到主要内容</a>

    <div class="space-bg" aria-hidden="true"></div>
    <div class="dust-layer" aria-hidden="true"></div>
    <div class="hex-grid" aria-hidden="true"></div>
    <div class="scanline-layer" aria-hidden="true"></div>

    <div class="container">
        <header>
            <div class="logo-wrap">
                <div class="logo-icon"><i class="fa-solid fa-ranking-star"></i></div>
                <div class="logo-titles">
                    <h1>全球排行</h1>
                    <p>星海猎手 V7 飞行员名人堂</p>
                </div>
            </div>
            <div class="nav-actions">
                <div class="status-badge" id="syncStatus" title="联机服务状态">
                    <div class="status-dot"></div>
                    <span id="syncStatusText">连接中</span>
                </div>
                <a href="v7_hangar.html?v=7.5" class="back-btn"><i class="fa-solid fa-user-astronaut"></i> 永久机库</a>
                <a href="space_shooter.html?v=7.5" class="back-btn" id="backToGameBtn"><i class="fa-solid fa-plane-departure"></i> 进入游戏</a>
            </div>
        </header>

        <div class="dashboard-grid" id="mainContent">
            <section class="glass-panel" id="userCenterPanel">
                <div class="panel-heading">
                    <div class="panel-title"><i class="fa-solid fa-id-card-clip"></i> 飞行员档案</div>
                    <span class="panel-subtitle">profile</span>
                </div>

                <div class="profile-row">
                    <button class="profile-avatar" id="avatarBox" type="button" title="更换头像">
                        <i class="fa-solid fa-user-astronaut" id="currentAvatarIcon"></i>
                        <div class="ship-badge" id="avatarShipBadge" title="当前涂装">D</div>
                    </button>
                    <div class="profile-info">
                        <span class="player-tag">飞行员呼号</span>
                        <input type="text" id="playerNameInput" class="player-name-input" placeholder="输入排行榜昵称" maxlength="12" autocomplete="off">
                        <div class="rank-pill" id="playerRankPill">
                            <i class="fa-solid fa-ranking-star"></i>
                            <span id="playerRankText">全球排名 —</span>
                        </div>
                    </div>
                </div>

                <div class="profile-field">
                    <label for="pilotSignature">飞行签名</label>
                    <textarea id="pilotSignature" maxlength="48" rows="2" placeholder="写一句会显示在你的个人资料里的宣言"></textarea>
                </div>

                <div class="pilot-id-row">
                    <span id="pilotIdText">usr_--------</span>
                    <button id="btnCopyId" type="button"><i class="fa-regular fa-copy"></i> 复制 ID</button>
                </div>

                <div class="stats-grid">
                    <div class="stat-card neon-border-cyan">
                        <span class="stat-label">本地最高记录</span>
                        <div class="stat-value color-cyan stat-num" id="localHighScoreText">—</div>
                        <div class="stat-footer">来自游戏存档</div>
                    </div>
                    <div class="stat-card neon-border-amber">
                        <span class="stat-label">星核余额</span>
                        <div class="stat-value color-amber stat-num" id="permanentCoresText">0</div>
                        <div class="stat-footer">永久机库资产</div>
                    </div>
                </div>

                <div class="cloud-card">
                    <div>
                        <span class="player-tag">账号绑定</span>
                        <strong id="bindStatusText">游客档案</strong>
                        <p id="boundAccountEmail">绑定用户名或邮箱后，资料会随排行榜同步。</p>
                    </div>
                    <span class="binding-badge badge-guest" id="bindStatusBadge"><i class="fa-solid fa-circle-exclamation"></i> 游客</span>
                </div>

                <div class="bind-form" id="bindForm">
                    <input type="text" id="bindEmail" class="form-input" placeholder="用户名或邮箱" autocomplete="username">
                    <input type="password" id="bindPassword" class="form-input" placeholder="绑定密码" autocomplete="new-password">
                    <button class="secondary-action-btn" id="btnBindAccount" type="button"><i class="fa-solid fa-link"></i> 绑定档案</button>
                </div>
                <div class="bound-actions" id="boundDetails">
                    <div class="bound-lock-note"><i class="fa-solid fa-lock"></i> 当前档案已绑定，绑定关系会持续用于云存档同步。</div>
                    <button class="secondary-action-btn account-logout-btn" id="btnLogoutAccount" type="button"><i class="fa-solid fa-right-from-bracket"></i> 退出账号</button>
                </div>

                <div class="hangar-summary" id="hangarSummary">
                    <div class="hangar-summary-head">
                        <div class="hangar-summary-title"><i class="fa-solid fa-warehouse"></i> 机库摘要</div>
                        <a class="hangar-link" href="v7_hangar.html?v=7.5"><i class="fa-solid fa-arrow-up-right-from-square"></i> 前往机库</a>
                    </div>
                    <div class="hangar-summary-grid">
                        <div class="hangar-summary-card">
                            <span>当前出战</span>
                            <strong id="hangarCurrentShip">先驱者默认</strong>
                        </div>
                        <div class="hangar-summary-card">
                            <span>已解锁涂装</span>
                            <strong id="hangarUnlockedCount">1 / 4</strong>
                        </div>
                        <div class="hangar-summary-card">
                            <span>永久天赋</span>
                            <strong id="hangarTalentTotal" class="stat-num">LV.0</strong>
                        </div>
                    </div>
                </div>
            </section>

            <section class="glass-panel" id="leaderboardPanel">
                <div class="panel-heading">
                    <div class="panel-title"><i class="fa-solid fa-trophy"></i> 全球星海名人堂</div>
                    <span class="panel-subtitle">top 10</span>
                </div>
                <div class="leaderboard-header-row" aria-hidden="true">
                    <span>排名</span>
                    <span>飞行员</span>
                    <span>得分</span>
                </div>
                <div class="leaderboard-list" id="leaderboardList"></div>
            </section>
        </div>

        <section class="glass-panel history-panel">
            <div class="panel-heading">
                <div class="panel-title"><i class="fa-solid fa-clock-rotate-left"></i> 我的最近对局</div>
                <span class="panel-subtitle">local matches</span>
            </div>
            <div class="match-history-list" id="matchHistoryList"></div>
        </section>
    </div>

    <div class="modal" id="avatarModal" aria-hidden="true">
        <div class="glass-panel modal-card">
            <div class="modal-header">
                <div class="modal-title"><i class="fa-solid fa-user-astronaut"></i> 选择头像</div>
                <button class="close-modal-btn" id="btnCloseAvatarModal" type="button">&times;</button>
            </div>
            <div class="avatar-grid" id="avatarGrid">
                <button class="avatar-select-card" data-avatar="fa-user-astronaut" type="button"><i class="fa-solid fa-user-astronaut"></i><span>航员</span></button>
                <button class="avatar-select-card" data-avatar="fa-helmet-safety" type="button"><i class="fa-solid fa-helmet-safety"></i><span>工程</span></button>
                <button class="avatar-select-card" data-avatar="fa-jet-fighter-up" type="button"><i class="fa-solid fa-jet-fighter-up"></i><span>王牌</span></button>
                <button class="avatar-select-card" data-avatar="fa-satellite-dish" type="button"><i class="fa-solid fa-satellite-dish"></i><span>领航</span></button>
                <button class="avatar-select-card" data-avatar="fa-meteor" type="button"><i class="fa-solid fa-meteor"></i><span>星陨</span></button>
                <button class="avatar-select-card" data-avatar="fa-crown" type="button"><i class="fa-solid fa-crown"></i><span>王冠</span></button>
            </div>
            <div class="form-footer">
                <button class="secondary-action-btn" id="btnCancelAvatar" type="button">取消</button>
                <button class="primary-action-btn" id="btnConfirmAvatar" type="button">确认头像</button>
            </div>
        </div>
    </div>

    <div class="custom-toast" id="customToast" role="status" aria-live="polite">
        <i class="fa-solid fa-circle-info" id="toastIcon"></i>
        <span id="toastText">已更新</span>
    </div>

    <script src="js/leaderboard_config.js?v=7.5"></script>
    <script src="js/leaderboard_api.js?v=7.5"></script>
    <script src="js/leaderboard_page.js?v=7.5"></script>
</body>
</html>
